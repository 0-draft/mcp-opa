name: publish to MCP registry

# Listing in the official MCP registry is how a client discovers this server
# without being told the repository name. The listing is per-version, so it runs
# once per release, after the image it points at has been pushed.
#
# Two entry points, one definition: release.yml calls this at the end of a tag
# run, and workflow_dispatch re-runs it on its own when a listing needs fixing
# without cutting another release. It is deliberately *not* triggered by
# `release: published` — goreleaser creates the release with GITHUB_TOKEN, and
# GitHub does not fire workflow triggers from a GITHUB_TOKEN action, so that
# trigger never fires and the job silently never runs.

on:
  workflow_call:
    inputs:
      version:
        description: "Tag or version to publish, with or without the leading v"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Tag or version to publish, with or without the leading v (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: read
  # The registry authenticates the io.github.kanywst namespace with a GitHub
  # OIDC token, so there is no secret to leak or rotate.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # server.json carries the version twice — once at the top level, once as
      # the tag on the OCI identifier. An OCI package must *not* carry a
      # separate `version` field; the registry rejects that outright and tells
      # you to put the tag in the identifier instead. Both are stamped from the
      # tag rather than maintained by hand, because a stale one fails at publish
      # time with a message about the registry rather than about this file.
      - name: Stamp the released version into server.json
        env:
          VERSION: ${{ inputs.version }}
        run: |
          v="${VERSION#v}"
          if [ -z "$v" ]; then
            echo "::error::no version to publish"
            exit 1
          fi
          jq --arg v "$v" '
            .version = $v
            | .packages[0].identifier = ((.packages[0].identifier | split(":")[0]) + ":" + $v)
            | del(.packages[0].version)
          ' server.json > server.json.tmp
          mv server.json.tmp server.json
          cat server.json

      # The image has to be pullable *anonymously* before the registry will
      # accept a manifest pointing at it, and a package pushed for the first
      # time by GITHUB_TOKEN is private by default. Checking without credentials
      # is the point: a listing pointing at a private image is a listing nobody
      # can install.
      - name: Verify the image is publicly pullable
        env:
          VERSION: ${{ inputs.version }}
        run: |
          v="${VERSION#v}"
          if ! docker manifest inspect "ghcr.io/kanywst/mcp-opa-authz:${v}" > /dev/null 2>&1; then
            echo "::error::ghcr.io/kanywst/mcp-opa-authz:${v} is not anonymously pullable. If the release pushed it, the package is private — set its visibility to public under the repository's Packages settings. The registry listing would otherwise point at an image nobody can pull."
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" \
            | tar -xz mcp-publisher
          ./mcp-publisher --help > /dev/null

      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
