name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Run tests with coverage
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out -v ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run end-to-end MCP smoke test
        run: make smoke

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck (Go module CVE scan)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: osv-scanner (OSV.dev cross-ecosystem scan)
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        env:
          # setup-go exports GOTOOLCHAIN=local, which leaks into the scanner
          # container. Its bundled Go is older than our go directive, so the
          # reachability analysis can't load packages and every vuln in the
          # module graph gets reported as if it were called.
          GOTOOLCHAIN: auto
        with:
          scan-args: |-
            --recursive
            ./

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  # scripts/smoke.sh is the only end-to-end check there is, so it is worth
  # holding to the same standard as the Go code.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

  # The release path was the one thing nothing here exercised, and it broke on
  # the first tag that used it: `dockers_v2` hands the Dockerfile a context
  # holding only the cross-compiled binaries laid out by platform, not the
  # source tree, so a COPY written for an ordinary build context resolved to
  # nothing. `goreleaser check` validates the config's shape and cannot catch
  # that. A snapshot build runs the whole thing without publishing, and then the
  # image it produced has to actually answer.
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build the release without publishing it
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          # Signing needs the OIDC token a tag run has, and the SBOM step adds
          # minutes without testing anything this job is for.
          args: release --snapshot --clean --skip=publish,sign,sbom
      - name: Check the release image serves MCP over stdio
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | docker run -i --rm ghcr.io/kanywst/mcp-opa-authz:latest-amd64 \
            | jq -e 'select(.id == 2) | (.result.tools | length) == 4' > /dev/null

  # The container image is a supported way to run this and the only channel the
  # MCP registry accepts, so a broken Dockerfile is a broken release.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t mcp-opa-authz:ci .
      - name: Check it serves MCP over stdio
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | docker run -i --rm mcp-opa-authz:ci \
            | jq -e 'select(.id == 2) | (.result.tools | length) == 4' > /dev/null

  # server.json is published to the MCP registry from a tag; a schema error
  # should surface on the pull request rather than during a release.
  server-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate server.json
        run: |
          python3 -c "import json,sys; json.load(open('server.json'))"
          jq -e '.name and .description and .version and (.packages | length > 0)' server.json > /dev/null
          # The registry caps the description at 100 characters and only says so
          # at publish time, on a tag, after the release has already shipped.
          # v0.2.0 failed on exactly this with a 127-character one.
          n=$(jq -r '.description | length' server.json)
          if [ "$n" -gt 100 ]; then
            echo "::error::server.json description is $n characters; the MCP registry rejects anything over 100"
            exit 1
          fi
          # The environment variables the manifest advertises have to be ones
          # the server actually reads, or the listing lies to whoever installs it.
          for v in $(jq -r '.packages[0].environmentVariables[].name' server.json); do
            grep -q "\"$v\"" config.go || { echo "::error::server.json advertises $v, which config.go does not read"; exit 1; }
          done
